name: Collect Freelancer.com project statuses

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        default: "2026-01-01"
      end:
        description: "End date (YYYY-MM-DD, empty = yesterday)"
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run collector
        run: |
          python collect.py --start "${{ github.event.inputs.start || '2026-01-01' }}" \
            ${{ github.event.inputs.end && format('--end {0}', github.event.inputs.end) || '' }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data RESULTS.md
          git diff --cached --quiet || git commit -m "Update Freelancer.com project status data"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: freelancer-data
          path: |
            data/
            RESULTS.md
